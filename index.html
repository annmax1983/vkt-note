<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vkt-note - Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #181825; border: 1px solid #313244; border-radius: 16px; max-width: 600px; width: 100%; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .banner { background: linear-gradient(135deg, #1e1e2e, #313244); padding: 40px 32px 32px; text-align: center; }
    .banner-icon { font-size: 48px; margin-bottom: 12px; }
    .banner h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #89b4fa, #74c7ec); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .banner p { color: #a6adc8; font-size: 14px; }
    .body { padding: 28px 32px; }
    .body h2 { font-size: 16px; color: #89b4fa; margin-bottom: 14px; }
    .body ul { list-style: none; padding: 0; margin-bottom: 20px; }
    .body li { padding: 6px 0; font-size: 14px; color: #bac2de; border-bottom: 1px solid #1e1e2e; }
    .body li:last-child { border-bottom: none; }
    .body li::before { content: '✓ '; color: #89b4fa; }
    .thank { margin-top: 20px; }
    .thank p { font-size: 14px; color: #bac2de; line-height: 1.7; margin-bottom: 10px; }
    .heart { color: #f38ba8; }
    .cta { text-align: center; padding: 20px 32px 28px; border-top: 1px solid #313244; }
    .cta p { font-size: 13px; color: #6c7086; margin-bottom: 14px; }
    .support-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, #89b4fa, #74c7ec); color: #1e1e2e; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
    .support-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(137,180,250,0.3); }
    .footer { padding: 16px 32px; text-align: center; font-size: 12px; color: #6c7086; border-top: 1px solid #1e1e2e; }
    .footer a { color: #89b4fa; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="banner-icon">📝</div>
      <h1>vkt-note</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="body">
      <h2 data-i18n="featuresTitle"></h2>
      <ul id="featureList"></ul>
      <h2 data-i18n="thankTitle"></h2>
      <div class="thank" id="thankText"></div>
    </div>
    <div class="cta">
      <p data-i18n="ctaHint"></p>
      <a class="support-btn" href="https://ko-fi.com/annmax?ref=vkt-note" target="_blank" rel="noopener">
        ☕ <span data-i18n="btnText"></span>
      </a>
    </div>
    <div class="footer">
      <a href="https://gitee.com/xinsiyu/vkt-note" target="_blank" rel="noopener">Gitee</a> ·
      <a href="https://annmax1983.github.io/vkt-note/privacy-policy.html" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy</a> ·
      Copyright © 2026 vkt-note
    </div>
  </div>
  <script>
    const I18N = {
      zh: { tagline: '划词摘录 · Markdown本地笔记工具', featuresTitle: '✨ 功能特色', features: ['划词摘录：网页选中文本/图片，右键快速新建Markdown笔记', '源码编辑+实时预览，支持表格、图片、代码块等完整Markdown语法', '一键插入当前网页URL和标题，自动记录来源信息', '免费版每日3条笔记，删除当日笔记归还额度', '全部笔记存储在浏览器本地，隐私安全，不上传服务器', '高级版解锁无限笔记和JSON导出功能'], thankTitle: '💌 想对你说', thank: ['感谢你使用 vkt-note。做这个工具是因为想要一个轻量、隐私优先的划词笔记插件，不需要注册账号，不需要联网。', '如果它也帮到了你，那对我来说就是最好的回报。', '当然，如果你愿意请我喝一杯咖啡 <span class="heart">☕</span>，我会非常开心。'], ctaHint: '点击下方按钮，跳转到支持页面', btnText: 'Support My Work', privacyPolicy: '隐私条款' },
      en: { tagline: 'Text Selection · Markdown Note-Taking', featuresTitle: '✨ Features', features: ['Select text or right-click images on any webpage to create Markdown notes', 'Source editor + live preview with full Markdown support (tables, images, code blocks)', 'One-click insert current page URL and title with source tracking', 'Free tier: 3 notes/day, delete today\'s notes to reclaim quota', 'All notes stored locally in your browser — private, no cloud sync', 'Premium unlocks unlimited notes and JSON export'], thankTitle: '💌 A Note to You', thank: ['Thank you for using vkt-note. I built this because I wanted a lightweight, privacy-first note-taking extension that works without accounts or cloud services.', 'If it helps you too, that\'s already the best reward.', 'Of course, if you\'d like to <span class="heart">☕</span> buy me a coffee, it would truly make my day.'], ctaHint: 'Click below to visit the support page', btnText: 'Support My Work', privacyPolicy: 'Privacy' },
      ja: { tagline: 'テキスト選択 · Markdownノートツール', featuresTitle: '✨ 機能', features: ['网页テキスト選択・画像右クリックでMarkdownノート作成', 'ソースエディタ＋ライブプレビュー、テーブル・画像・コードブロック対応', 'ワンクリックで現在のURL・タイトル挿入、ソース記録', '無料版1日3件、削除で枠回復', 'ローカル保存、プライバシー重視、クラウド不要', 'プレミアムで無制限ノートとJSONエクスポート'], thankTitle: '💌 ご利用ありがとうございます', thank: ['vkt-noteをご利用いただきありがとうございます。アカウント不要、クラウド不要の軽量ノートツールを作りたかったのです。', 'お役に立てれば幸いです。', 'コーヒーを <span class="heart">☕</span> 一杯おごっていただけると嬉しいです。'], ctaHint: 'サポートページへ', btnText: 'Support My Work', privacyPolicy: 'プライバシー' },
      de: { tagline: 'Textauswahl · Markdown-Notiztool', featuresTitle: '✨ Funktionen', features: ['Text auswählen oder Bilder rechtsklicken für Markdown-Notizen', 'Quell-Editor + Live-Vorschau mit voller Markdown-Unterstützung', 'Ein-Klick-URL- und Titel-Einfügung mit Quellverfolgung', 'Kostenlos 3 Notizen/Tag, Löschen gibt Kontingent frei', 'Lokale Speicherung, datenschutzfreundlich, kein Cloud-Sync', 'Premium: unbegrenzte Notizen und JSON-Export'], thankTitle: '💌 Danke', thank: ['Vielen Dank für vkt-note. Ich wollte ein leichtes, datenschutzfreundliches Notiz-Tool.', 'Freut mich, wenn es hilft.', 'Ein <span class="heart">☕</span> Kaffee würde mich sehr freuen.'], ctaHint: 'Zur Support-Seite', btnText: 'Support My Work', privacyPolicy: 'Datenschutz' },
      es: { tagline: 'Selección de texto · Notas Markdown', featuresTitle: '✨ Características', features: ['Selecciona texto o clic derecho en imágenes para crear notas Markdown', 'Editor fuente + vista previa con soporte Markdown completo', 'Inserción con un clic de URL y título de página actual', 'Gratis 3 notas/día, eliminar notas de hoy para recuperar cuota', 'Almacenamiento local, privacidad primero, sin sincronización', 'Premium: notas ilimitadas y exportación JSON'], thankTitle: '💌 Gracias', thank: ['Gracias por usar vkt-note. Quería una herramienta ligera y privada.', 'Si te ayuda, es la mejor recompensa.', 'Un <span class="heart">☕</span> café me haría muy feliz.'], ctaHint: 'Ir a soporte', btnText: 'Support My Work', privacyPolicy: 'Privacidad' },
      fr: { tagline: 'Sélection de texte · Notes Markdown', featuresTitle: '✨ Fonctionnalités', features: ['Sélectionnez du texte ou clic droit sur images pour créer des notes Markdown', 'Éditeur source + aperçu en direct avec support Markdown complet', 'Insertion en un clic de l\'URL et du titre de la page actuelle', 'Gratuit 3 notes/jour, supprimer les notes du jour pour récupérer le quota', 'Stockage local, confidentialité d\'abord, pas de synchronisation', 'Premium : notes illimitées et export JSON'], thankTitle: '💌 Merci', thank: ['Merci d\'utiliser vkt-note. Je voulais un outil léger et respectueux de la vie privée.', 'S\'il vous aide, c\'est la meilleure récompense.', 'Un <span class="heart">☕</span> café me ferait très plaisir.'], ctaHint: 'Page de soutien', btnText: 'Support My Work', privacyPolicy: 'Confidentialité' }
    };
    function detectLang() { const c = (navigator.language || 'en').split('-')[0].toLowerCase(); return I18N[c] ? c : 'en'; }
    function applyLang(lang) { const t = I18N[lang]; document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k]) el.textContent = t[k]; }); document.getElementById('featureList').innerHTML = t.features.map(f => `<li>${f}</li>`).join(''); document.getElementById('thankText').innerHTML = t.thank.map(p => `<p>${p}</p>`).join(''); document.documentElement.lang = lang; }
    applyLang(detectLang());
  </script>
</body>
</html>
